# Crea i progetti di ricerca (Piano Marshall, Fondo Sociale Europeo) nell'account dell'amministratore, nel database ONLINE.
# Si avvia a mano: GitHub → Actions → «Progetti di ricerca» → Run workflow. Stessi segreti dell'import della Biblioteca.
# Idempotente: un progetto già creato non viene duplicato.
name: Progetti di ricerca

on:
  workflow_dispatch:
    inputs:
      kit:
        description: "Quale progetto creare"
        type: choice
        default: all
        options: [all, piano-marshall, fse-1958-1989]

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXUS_ENV: production
      NEXUS_DATABASE_URL: ${{ secrets.NEXUS_DATABASE_URL }}
      NEXUS_SUPABASE_URL: ${{ secrets.NEXUS_SUPABASE_URL }}
      NEXUS_SUPABASE_SERVICE_KEY: ${{ secrets.NEXUS_SUPABASE_SERVICE_KEY }}
      NEXUS_STORAGE_BACKEND: supabase
      NEXUS_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Dipendenze
        run: pip install -r backend/requirements.txt
      - name: Controllo dei segreti
        run: |
          if [ -z "$NEXUS_DATABASE_URL" ]; then echo "Manca il segreto NEXUS_DATABASE_URL"; exit 1; fi
      - name: Crea i progetti
        run: |
          if [ "${{ inputs.kit }}" = "all" ]; then python scripts/create_research_projects.py
          else python scripts/create_research_projects.py --kit "${{ inputs.kit }}"; fi
