# Test automatici a ogni push e pull request: backend (SQLite e PostgreSQL), app e sito.
# Un deploy riuscito non basta: questa pipeline dice se i test sono effettivamente passati.
name: Test

on:
  push:
    branches: ["**"]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Test con SQLite
        if: matrix.db == 'sqlite'
        run: python -m pytest -p no:logging
      - name: Test con PostgreSQL (come la versione online)
        if: matrix.db == 'postgres'
        env:
          NEXUS_TEST_PG: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m pytest -p no:logging

  backup-restore:
    name: Backup e ripristino (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG: postgresql://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt
      - name: Client PostgreSQL 16 (stessa versione del server di prova)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Database di origine con dati creati tramite l'API
        run: |
          psql "$PG/postgres" -c "CREATE DATABASE origine" -c "CREATE DATABASE ripristino"
          python scripts/backup_restore_check.py seed "$PG/origine"
      - name: Backup con le stesse opzioni del backup settimanale
        run: |
          pg_dump "$PG/origine" --schema=public --format=custom --compress=9 --no-owner --no-privileges -f backup.dump
          pg_restore --list backup.dump > /dev/null
          ls -lh backup.dump
      - name: Ripristino completo in un database temporaneo
        run: pg_restore --clean --if-exists --no-owner --no-privileges --exit-on-error -d "$PG/ripristino" backup.dump
      - name: Confronto tabella per tabella (righe e impronta MD5)
        run: python scripts/backup_restore_check.py compare "$PG/origine" "$PG/ripristino"
      - name: L'app legge il database ripristinato
        run: python scripts/backup_restore_check.py app "$PG/ripristino"

  frontend:
    name: App (tipi, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  website:
    name: Sito (test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build
