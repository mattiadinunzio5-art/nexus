# Riempie la Biblioteca NEXUS del database ONLINE con dati aperti (vedi docs/DATA.md).
# Si avvia a mano: GitHub → Actions → «Import Biblioteca NEXUS» → Run workflow.
# Richiede i segreti del repository (Settings → Secrets and variables → Actions), copiati dalle variabili di Render:
#   NEXUS_DATABASE_URL, NEXUS_SUPABASE_URL, NEXUS_SUPABASE_SERVICE_KEY (quest'ultima serve solo ai documenti).
# Idempotente: si può rilanciare quante volte serve, non duplica nulla.
name: Import Biblioteca NEXUS

on:
  workflow_dispatch:
    inputs:
      area:
        description: "Cosa importare"
        type: choice
        default: all
        options: [all, series, events, graph, biblio, docs, discovery, stats]
      profile:
        description: "Profilo (online = limiti per il database gratuito da 500 MB)"
        type: choice
        default: online
        options: [online, full]
      limit:
        description: "Limite per prova (vuoto = quello del profilo)"
        required: false
        default: ""

concurrency:
  group: import-library
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      NEXUS_ENV: production
      NEXUS_DATABASE_URL: ${{ secrets.NEXUS_DATABASE_URL }}
      NEXUS_SUPABASE_URL: ${{ secrets.NEXUS_SUPABASE_URL }}
      NEXUS_SUPABASE_SERVICE_KEY: ${{ secrets.NEXUS_SUPABASE_SERVICE_KEY }}
      NEXUS_STORAGE_BACKEND: supabase
      NEXUS_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Dipendenze
        run: pip install -r backend/requirements.txt
      - name: Controllo dei segreti
        run: |
          if [ -z "$NEXUS_DATABASE_URL" ]; then echo "Manca il segreto NEXUS_DATABASE_URL (vedi docs/DATA.md)"; exit 1; fi
      - name: Cache delle risposte delle fonti
        uses: actions/cache@v4
        with:
          path: data/cache
          key: nexus-import-cache-${{ github.run_id }}
          restore-keys: nexus-import-cache-
      - name: Import
        run: |
          ARGS="${{ inputs.area }} --profile ${{ inputs.profile }}"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.area }}" = "all" ] && [ -z "$NEXUS_SUPABASE_SERVICE_KEY" ]; then
            echo "Senza NEXUS_SUPABASE_SERVICE_KEY i documenti vengono saltati."
            for a in series events graph biblio discovery; do python scripts/import_data.py $a --profile ${{ inputs.profile }} --resume; done
          else
            python scripts/import_data.py $ARGS --resume
          fi
          python scripts/import_data.py stats
      - name: Log degli errori
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-logs
          path: data/imports/
          if-no-files-found: ignore
